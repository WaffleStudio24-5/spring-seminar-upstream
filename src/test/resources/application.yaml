# 테스트는 Testcontainers 가 띄운 일회용 MySQL 을 쓴다.
# jdbc:tc: 로 시작하는 URL 을 주면 드라이버가 컨테이너를 알아서 띄우고 지운다.
# (도커가 켜져 있어야 한다.)
spring:
  datasource:
    url: jdbc:tc:mysql:8.4:///seminar
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    # 컨테이너가 스스로 만드는 계정이라 드라이버가 이 값을 쓰지는 않는다.
    # data_access 예제가 DriverManager 로 직접 접속할 때 필요해서 적어 둔다.
    username: test
    password: test
